spring.application.name=A3HuyTran_SE1910
server.port=8080

# Database Configuration (MS SQL Server)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A3HuyTran_SE1910;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:29032005}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Staff Account Configuration
app.staff.email=${STAFF_EMAIL:admin@fuhotel.com}
app.staff.password=${STAFF_PASSWORD:Staff@123}
app.staff.name=${STAFF_NAME:Staff Administrator}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
